site_name: rulewise
site_description: Statistically sound association rule mining in Python
site_url: https://shadowgodd1.github.io/Rulewise/
repo_url: https://github.com/ShadowGodd1/Rulewise
repo_name: ShadowGodd1/Rulewise
docs_dir: docs

nav:
  - Home: index.md
  - API reference: api.md
  - Methodology: methodology.md
  - Limitations: limitations.md
  - Comparison: comparison.md
  - Tutorials:
      - Groceries: tutorials/groceries.md
      - Classification: tutorials/classification.md
  - Publishing: publishing.md

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - tables
  - fenced_code
  - admonition
  - toc:
      permalink: true
